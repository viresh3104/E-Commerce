<app-header></app-header>

<div class="body">
    <div class="outer">
        <div class="image">
            <div class="back">
                <button (click)="backImage()">
                    < </button>

            </div>

            <div class="main">
                <img src="{{productData?.image_urls[current_img]}}" alt="">
            </div>

            <div class="next">
                <button (click)="nextImage()">></button>
            </div>

        </div>

        <div class="details">
            <div class="inner">
                <div class="name">
                    <p>{{productData?.name}}</p>
                </div>

                <div class="descri">
                    <p>{{productData?.description}}</p>
                </div>

                <div class="price">
                    <p *ngIf="productData?.discountedPrice">
                        MRP : <span class="discounted-price">₹{{ productData.discountedPrice }}</span>
                        <span class="original-price">₹{{ productData.price }}</span>
                    </p>
                    <p *ngIf="!productData?.discountedPrice">
                        MRP <span>₹{{ productData?.price }}</span>
                    </p>
                    <p id="tax">
                        (inclusive of all taxes)
                    </p>
                </div>

                <!-- sizing -->
                <div class="size">
                    <div class="sizing" *ngIf="productData?.size == 'Footware'">
                        <p> Select sizing <i class="fa-solid fa-up-right-and-down-left-from-center"
                                style="color: #000000; font-size: 0.7em;"></i></p>
                        <div class="boxes">
                            <div class="box" *ngFor="let size of footware" (click)="sendsize(size)"
                                [ngClass]="{ 'active' : size === selectedSize}">
                                {{ size }}
                            </div>
                        </div>
                    </div>


                    <div class="sizing" *ngIf="productData?.size == 'Clothing'">
                        <p> Select sizing <i class="fa-solid fa-up-right-and-down-left-from-center"
                                style="color: #000000; font-size: 0.7em;"></i></p>
                        <div class="boxes">
                            <div class="box" *ngFor="let size of Clothing" (click)="sendsize(size)">
                                {{ size }}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- action buttons -->
                <div class="actions">
                    <button id="cart" (click)="cart()">Add to Cart</button>
                    <button id="wishlist" (click)="wishlist()">
                        {{ Iswishlist ? 'Remove From Favorites' : 'Add to Favorites' }}
                        <i class="fa-regular fa-heart" style="color: #000000;"></i>
                    </button>
                </div>

                <!-- details -->
                <div class="accordion">
                    <div class="accordion-item" *ngFor="let section of sections">
                        <div class="accordion-header" (click)="toggleSection(section)">
                            <span>{{ section.title }}</span>
                            <span class="arrow" [class.open]="section.open"><i class="fa-solid fa-angle-down"
                                    style="color: #000000;"></i></span> <!-- ▼ -->
                        </div>

                        <div class="accordion-body" *ngIf="section.open">
                            {{ section.content }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
