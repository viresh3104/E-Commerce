<div class="each_product">

    <div class="image">
        <img [src]="product.image_urls[0]" alt="">
    </div>

    <div class="product_detail">

        <div class="name_and_brand">
            <div class="name">
                <p>{{product.name}}</p>
            </div>

            <div class="product_actions" *ngIf="!isAdmin">
                <svg class="heart" [ngClass]="isWishlist ? 'filled' : 'outline'" (click)="wishlist()"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                      2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09
                      C13.09 3.81 14.76 3 16.5 3 
                      19.58 3 22 5.42 22 8.5
                      c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </div>
        </div>

        <div class="price_and_brand">
            <div class="price">
                <p *ngIf="product.discountedPrice">
                    MRP <span class="discounted-price">₹{{ product.discountedPrice }}</span>
                    <span class="original-price">₹{{ product.price }}</span>
                </p>
                <p *ngIf="!product.discountedPrice">
                    MRP <span>₹{{ product.price }}</span>
                </p>
            </div>

            <div class="brand">
                <p>{{product.brand}}</p>
            </div>
        </div>
    </div>
</div>
